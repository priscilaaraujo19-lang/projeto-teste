 <h1>São José</h1>
 <p>Vou compartilhar um pouco sobre São José</p>
 <header>
 <h2>“São José, homem corajoso, ensina-me a ser como tu, faz-me generoso!”</h2>
 <p>São José foi o carpinteiro escolhido por Deus para ser o esposo de Maria e o pai adotivo de Jesus, destacando-se na Bíblia por sua fé, obediência silenciosa e por proteger a Sagrada Família na fuga para o Egito.</p>
 <p>São José foi o esposo da Virgem Maria e o pai adotivo de Jesus, sendo venerado como o padroeiro universal da Igreja Católica, das famílias e dos trabalhadores.
